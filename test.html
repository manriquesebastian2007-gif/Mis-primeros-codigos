<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gran Página Web</title>
</head>
<body>

    <!-- 1. El Título principal (Encabezado gigante) -->
    <h1><strong>¡Hola mundo!</strong></h1>

    <!-- 2. Un texto o párrafo normal (<p>) -->
    <p>¡Bienvenido a mi primera página web! Aquí voy a aprender a construir cosas geniales.</p>

    <!-- 3. Un subtítulo más pequeño (<h2>) -->
    <h2>Mis juguetes / cosas favoritas:</h2>

    <!-- 4. Una lista con viñetas (<ul> = Lista sin orden, <li> = Elemento de lista) -->
    <ul>
        <li>Programar en Python</li>
        <li>Crear videojuegos</li>
        <li>Explorar mundos virtuales</li>
    </ul>

    <!-- 5. Un botón intercativo (<button>) -->
    <button onclick="alert('¡Hiciste clic en el botón!')">¡Haz clic aquí!</button>

</body>
</html>
